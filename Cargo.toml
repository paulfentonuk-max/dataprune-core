[package]
name = "dataprune-core"
version = "0.1.0"
edition = "2021"
authors = ["Paul Fenton <your-email@example.com>"]
description = "Core Rust libraries for Dataprune"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paulfentonuk-max/dataprune-core"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
aes-gcm = "0.10"
x25519-dalek = "2.0"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
